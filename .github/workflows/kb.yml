name: kb
# On every push of new data or pages: update the #4471 tickets from the data, rebuild the site,
# and commit the rendered pages (site/) and the ticket map back.
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'package*.json', 'vite.config.js']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-issues.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
      - run: node scripts/sync-issues.ts --check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site src/lib/data/tickets.json
          git diff --cached --quiet || git commit -m "Rebuild kb from data"
          git push
